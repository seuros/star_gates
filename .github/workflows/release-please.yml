name: release-please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach the gem for (skips release-please)
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ inputs.tag && 'true' || steps.release.outputs.release_created }}
      tag_name: ${{ inputs.tag || steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ !inputs.tag }}

  build-gem:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Build gem
        run: bundle exec rake build

      - name: Upload gem artifact
        uses: actions/upload-artifact@v7
        with:
          name: gem
          path: pkg/*.gem
          if-no-files-found: error

  publish-release-assets:
    needs:
      - release-please
      - build-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gem
          path: artifacts

      - name: Attach gem to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/*.gem --clobber --repo "$GITHUB_REPOSITORY"

  publish-to-github-packages:
    needs:
      - release-please
      - build-gem
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - uses: actions/download-artifact@v8
        with:
          name: gem
          path: artifacts

      - name: Setup gem credentials
        run: |
          mkdir -p ~/.gem
          cat << EOF > ~/.gem/credentials
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Publish gem to GitHub Packages
        run: |
          HOST="https://rubygems.pkg.github.com/${{ github.repository_owner }}"
          for gem in artifacts/*.gem; do
            if gem push --key github --host "$HOST" "$gem" > /tmp/push.log 2>&1; then
              echo "Pushed $gem"
            elif grep -q "already been pushed" /tmp/push.log; then
              echo "Skipping $gem (already published)"
            else
              cat /tmp/push.log
              exit 1
            fi
          done

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.gem/credentials
